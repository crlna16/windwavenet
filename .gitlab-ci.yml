# Adapted from template
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

stages:          # List of stages for jobs, and their order of execution
  - build
  - lint
  - test
  - deploy

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - echo "Dummy build stage ... does not do anything"

# From https://docs.astral.sh/ruff/integrations/#pre-commit
.base_ruff:
  stage: lint
  interruptible: true
  image:
    name: ghcr.io/astral-sh/ruff:0.11.8-alpine
  before_script:
    - cd $CI_PROJECT_DIR
    - ruff --version

ruff-check:
  extends: .base_ruff
  script:
    - ruff check --output-format=gitlab --exclude notebooks > code-quality-report.json
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json

ruff-format:
  extends: .base_ruff
  script:
    - ruff format --exclude notebooks --diff

# SPDX-FileCopyrightText: 2020 Free Software Foundation Europe e.V.
# SPDX-License-Identifier: CC0-1.0
reuse-check-licenses:
  stage: lint
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint

unit-tests:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  image: python:3.12
  script:
    - echo "Running unit tests..."
    - pip install uv
    # install the development environment
    - uv sync --group dev --active --frozen
    # download dummy data
    - wget -O data.zip "https://share.hereon.de/index.php/s/z8WsL3B7Qc2YMP8/download"
    - mkdir -p tests/cicd_data
    - unzip data.zip -d tests/cicd_data
    - pwd -P
    - uv run pytest --cov-report term --cov=src tests/
  only:
    - merge_requests
    - main
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'  # regex to extract coverage percentage from pytest output


deep-learning-pipeline: # runs in test
  stage: test
  image: python:3.12
  script:
    - pip install uv
    # install the project, without the development group, mimicking production environment
    - uv sync --no-group dev --active --frozen
    # download dummy data
    - wget -O data.zip "https://share.hereon.de/index.php/s/z8WsL3B7Qc2YMP8/download"
    - mkdir -p DATA
    - unzip data.zip -d DATA
    - pwd -P
    - echo "This runs the deep learning pipeline for various experiments."
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_target.yaml"
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_target.yaml" data.node_idx_csv="tests/cicd_data/node_idx.csv"
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_target.yaml" data.preload_data=false data.batch_size=4
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_lstm_target.yaml"
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_gcn.yaml"
    - HYDRA_FULL_ERROR=1 uv run ./src/train.py --config-path="../configs/cicd" --config-name="cicd_train_gcn.yaml data.full_graph_target=true"
    - echo "Finished deep learning tests without errors."
  only:
    - merge_requests
    - main

machine-learning-pipeline: # runs in test
  stage: test
  image: python:3.12
  script:
    - pip install uv
    # install the project, without the development group, mimicking production environment
    - uv sync --no-group dev --active --frozen
    # download dummy data
    - wget -O data.zip "https://share.hereon.de/index.php/s/z8WsL3B7Qc2YMP8/download"
    - mkdir -p DATA
    - unzip data.zip -d DATA
    - pwd -P
    - echo "This runs the machine learning pipeline for various experiments."
    - HYDRA_FULL_ERROR=1 uv run ./src/train_ml.py --config-path="../configs/cicd" --config-name="cicd_train_ml_target.yaml"
    - HYDRA_FULL_ERROR=1 uv run ./src/train_ml.py --config-path="../configs/cicd" --config-name="cicd_train_ml_target.yaml" data.node_idx_csv="tests/cicd_data/node_idx.csv"
    - HYDRA_FULL_ERROR=1 uv run ./src/train_ml.py --config-path="../configs/cicd" --config-name="cicd_train_ml_target.yaml" data.targets='["sigWaveHeight"]'
    # this should exit gracefully
    - HYDRA_FULL_ERROR=1 uv run ./src/train_ml.py --config-path="../configs/cicd" --config-name="cicd_train_ml_target.yaml" data.targets='["delta_sigWaveHeight", "delta_dominantDirection"]'
    - echo "Finished machine learning tests without errors."
  only:
    - merge_requests
    - main

pages:
  stage: deploy
  image: python:3.12
  script:
    - pip install uv
    - uv sync --dev --active --frozen
    - echo "Generating documentation..."
    - uv run pdoc src -o public
    - echo "Documentation generated successfully."
  artifacts:
    paths:
      - public
  only:
    - main
