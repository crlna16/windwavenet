[project]
name = "wave-wind-model-emulator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cartopy>=0.25.0",
    "dask>=2025.11.0",
    "ffmpeg>=1.4",
    "hydra-core>=1.3.2",
    "imageio>=2.37.3",
    "ipykernel>=7.1.0",
    "kdepy>=1.1.12",
    "lightning>=2.5.6",
    "netcdf4>=1.7.3",
    "omegaconf>=2.3.0",
    "pip>=25.3",
    "pytorch-forecasting>=1.5.0",
    "pyvista>=0.46.4",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "smogn>=0.1.2",
    "torch-geometric>=2.7.0",
    "trame>=3.12.0",
    "wandb>=0.23.0",
    "xarray>=2025.10.1",
    "xgboost>=3.1.1",
    "zarr>=3.1.5",
]

[dependency-groups]
dev = [
    "pdoc>=16.0.0",
    "pre-commit>=4.4.0",
    "psutil>=7.0.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "reuse>=6.2.0",
    "ruff>=0.14.5",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
