# @package _global_

# Configuration for training classical ML models (XGBoost, RandomForest, etc.)
# Separated from deep learning training for clarity

defaults:
  - _self_
  - experiment: null
  - optional local: default

## ----------------
## General settings
## ----------------
task_name: "train_ml"
experiment_name: "xgboost_default"

tags: ["classical_ml", "xgboost"]

test: True # evaluate on test set after training
predict: False # if True, generate predictions
save_model: True

seed: 260801

## ----------------------------------
## Data configuration (same as DL training)
## ----------------------------------
data:
  _target_: src.data.WWMDataModule.WWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [1, 304]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight
  scaling_config: null # do not scale for classical ML
  batch_size: 2048  # Not used for ML but kept for compatibility
  num_workers: 0  # Set to 0 for ML to avoid multiprocessing issues
  pin_memory: false
  persistent_workers: false

  # Sample weighting (optional)
  sample_weight_strategy: null
  sample_weight_power: 1.0
  subsample_prob: null # Set to value between 0 and 1 to enable subsampling (e.g., 0.3)

  # Preload training features in memory (targets are always preloaded)
  preload_data: true

## ----------------------------------
## Logger configuration
## ----------------------------------
logger: # set to null to disable logging
  wandb:
    project: wwm-emulator-hourly
    entity: wwm-emulator
    name: null  # Auto-generated if null
    #save_dir: "${paths.output_dir}"
    mode: online
    tags: ${tags}

## ----------------------------------
## ML Model configuration
## ----------------------------------
model:
  _target_: src.model.MLWrapper.MLModelWrapper

  target_names: ${data.targets}

  # Optional: specify bin edges for binned metrics
  target_bins: null
  # target_bins:
  #   delta_sigWaveHeight: [-0.2, -0.1, 0.0, 0.1, 0.2, 0.5]

  # Callbacks for XGBoost/LightGBM (e.g., WandB)
  callbacks:
    - _target_: wandb.integration.xgboost.WandbCallback
      log_model: false # Set to true to log model checkpoints

  # XGBoost model configuration
  model:
    _target_: xgboost.XGBRegressor
    objective: "reg:squarederror"
    random_state: ${seed}
    n_jobs: -1  # Use all CPU cores
    early_stopping_rounds: 10
    n_estimators: 1000
    max_depth: 8
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    colsample_bylevel: 0.8
    lambda: 0.1
    gamma: 0.1
    eta: 0.1
    # GPU acceleration (uncomment if you have GPU with XGBoost GPU support)
    # tree_method: "gpu_hist"
    # gpu_id: 0

paths:
  root_dir: ${hydra:runtime.cwd}
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}

hydra:
  defaults:
    - override hydra_logging: colorlog
    - override job_logging: colorlog

  run:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}

  sweep:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${task_name}_${experiment_name}.log
