# @package _global_

# default debugging setup, runs 1 full epoch
# other debugging configs can inherit from this one

# overwrite task name so debugging logs are stored in separate folder
task_name: "debug"

# disable callbacks and loggers during debugging
callbacks: null
logger: null

# sets level of all command line loggers to 'DEBUG'
# https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
hydra:
  job_logging:
    root:
      level: DEBUG

  # use this to also set hydra loggers to 'DEBUG'
  verbose: True

trainer:
  max_epochs: 1
  fast_dev_run: true
  devices: 1
  detect_anomaly: true # raise exception if NaN or +/-inf is detected in any tensor
  enable_progress_bar: true

data:
  num_workers: 0
  pin_memory: False
  # Use smaller subset of days for quick testing
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/combined
  node_idx_csv: null
  train_days: [31, 31]  # Just one day for debugging [start, end] inclusive
  val_days: [32, 32]  # Just one day for debugging [start, end] inclusive
  test_days: [33, 33]  # Just one day for debugging [start, end] inclusive
