program: src/train.py
project: simple-wwm-emulator
entity: wwm-emulator
method: bayes
metric:
  goal: minimize
  name: val/rmse_delta_sigWaveHeight_>=0.1
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - experiment=densenet_8_features
  - callbacks.early_stopping.patience=3
  - model.scheduler.patience=2
  - model.sample_weight_strategy=abs_value
parameters:
  # Data parameters
  data.batch_size:
    distribution: int_uniform
    max: 4096
    min: 32

  # Model options
  model.sample_weight_power:
    distribution: uniform
    min: 0
    max: 100

  model.normalize_sample_weights:
    distribution: categorical
    values:
      - true
      - false

  # Model backbone parameters - architecture configuration
  model.backbone.num_hidden_layers:
    distribution: int_uniform
    max: 6
    min: 1

  model.backbone.first_layer_neurons:
    distribution: categorical
    values:
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024

  model.backbone.layer_scaling:
    distribution: categorical
    values:
      - constant
      - halving

  model.backbone.dropout_rate:
    distribution: uniform
    max: 0.9
    min: 0.0

  # Optimizer parameters
  model.optimizer.lr:
    distribution: log_uniform_values
    max: 0.001
    min: 0.00001
