# wandb sweep for MultiHeadGATLSTMVN on swh, seq_len=6, max_nodes=500.
#
# Launch with:
#   wandb sweep configs/sweeps/sweep_swh_1h_gat_lstm_vn_seq6_500n.yaml
#   wandb agent <sweep-id>
#
# Metric: val/best_rmse_sigWaveHeight is UNWEIGHTED, so it stays comparable
# across runs even though data.sample_weight_power is swept (val/loss and
# the checkpoint selection are weighted and change shape with the power —
# inspect the curves per run before trusting a single number).
#
# The LSTM here encodes only the center node's history to initialize the
# virtual node (CenterHistoryGraphWWMDataModule), so lstm_hidden_dim can
# stay small relative to hidden_dim.

program: src/train.py
project: wwm-emulator-sweeps
entity: wwm-emulator
#method: bayes
method: random
run_cap: 50
metric:
  goal: minimize
  name: val/best_rmse_sigWaveHeight
early_terminate:
  type: hyperband
  min_iter: 7
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - experiment=swh_1h_gat-lstm-vn
  - logger.wandb.project=wwm-emulator-sweeps
  - data.seq_len=6
  - data.max_nodes=500
  # Reduced patience for sweep economy (final training uses the longer
  # patience from train.yaml); allows one full LR-reduction cycle.
  - callbacks.early_stopping.patience=8
  # Sweeps don't need checkpoints; disable to save disk and I/O.
  - callbacks.model_checkpoint=null
  - trainer.enable_progress_bar=false
  - trainer.max_epochs=25
  - test=false
  # from LSTM
  - data.sample_weight_variable=delta_sigWaveHeight
  - data.sample_weight_power=0.20
  - data.node_idx_csv=src/data/node_selection/node_idx_closest_center_graph-tuning.csv
  - model.backbone.edge_encoding=scalar
parameters:

  model.backbone.hidden_dim:
    distribution: categorical
    values:
      - 32
      - 64

  model.backbone.heads:
    distribution: categorical
    values:
      - 1
      - 2
      - 4

  model.backbone.num_layers:
    distribution: categorical
    values:
      - 3
      - 6
      - 9

  model.backbone.lstm_hidden_dim:
    distribution: categorical
    values:
      - 32
      - 64
      - 128

  model.backbone.num_lstm_layers:
    distribution: int_uniform
    min: 1
    max: 3

  model.backbone.dropout:
    distribution: categorical
    values:
      - 0.0
      - 0.1
      - 0.2
      - 0.3
      - 0.4

  model.backbone.attn_dropout:
    distribution: categorical
    values:
      - 0.0
      - 0.1
      - 0.2
      - 0.3
      - 0.4

  model.optimizer.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.003
