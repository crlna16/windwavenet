program: src/train.py
project: wwm-emulator-hourly
entity: wwm-emulator
method: bayes
metric:
  goal: minimize
  name: val/best_loss
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - experiment=densenet_1h
  - callbacks.early_stopping.patience=3
  - model.scheduler.patience=2
  - +trainer.limit_val_batches=1000
  - data.preload_data=true
  - data.train_days=[1, 90]
  - trainer.enable_progress_bar=false
  - data.scaling_config=src/data/scaling/scale_2020_JFM_hourly.yaml
  - data.node_idx_csv=/work/ka1176/caroline/gitlab/wave-wind-model-emulator/src/data/node_selection/node_idx_closest_center_10000.csv
parameters:
  # Data parameters
  #data.batch_size:
  #  distribution: int_uniform
  #  max: 4096
  #  min: 32

  # Model backbone parameters - architecture configuration
  model.backbone.num_hidden_layers:
    distribution: int_uniform
    max: 6
    min: 1

  model.backbone.first_layer_neurons:
    distribution: categorical
    values:
      - 8
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
      - 1024

  model.backbone.layer_scaling:
    distribution: categorical
    values:
      - constant
      - halving

  model.backbone.dropout_rate:
    distribution: uniform
    max: 0.9
    min: 0.0

  # Optimizer parameters
  model.optimizer.lr:
    distribution: log_uniform_values
    max: 0.001
    min: 0.00001

  trainer.val_check_interval:
    distribution: int_uniform
    min: 1
    max: 10000
