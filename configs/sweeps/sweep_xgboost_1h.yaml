program: src/train_ml.py
project: wwm-emulator-hourly
entity: wwm-emulator
method: bayes
metric:
  goal: minimize
  #name: val/rmse_delta_sigWaveHeight #_>=0.1
  name: val/rmse_sigWaveHeight #_>=0.1
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - experiment=xgboost_1h
  - data.train_days=[1, 90]
parameters:
  # Data parameters
  data.sample_weight_power:
    distribution: uniform
    min: 0.00001
    max: 100

  data.subsample_prob:
    distribution: uniform
    min: 0.01
    max: 1.0

  # XGBoost parameters
  model.model.n_estimators:
    distribution: int_uniform
    min: 1
    max: 4000

  model.model.max_depth:
    distribution: int_uniform
    min: 1
    max: 20

  model.model.learning_rate:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.5

  model.model.subsample:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.model.colsample_bytree:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.model.colsample_bylevel:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.model.eta:
    distribution: uniform
    min: 0.01
    max: 0.99

  model.model.gamma:
    distribution: uniform
    min: 0
    max: 10

  model.model.lambda:
    distribution: uniform
    min: 0.1
    max: 10
