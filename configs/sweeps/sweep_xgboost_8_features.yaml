program: src/train.py
project: simple-wwm-emulator
entity: wwm-emulator
method: bayes
metric:
  goal: minimize
  name: val/rmse_delta_sigWaveHeight_>=0.1
command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - experiment=xgboost_8_features
parameters:
  # Data parameters
  data.sample_weight_power:
    distribution: uniform
    min: 0
    max: 100

  # XGBoost parameters
  model.n_estimators:
    distribution: int_uniform
    min: 1
    max: 4000

  model.max_depth:
    distribution: int_uniform
    min: 1
    max: 20

  model.learning_rate:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.5

  model.subsample:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.colsample_bytree:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.colsample_bylevel:
    distribution: uniform
    min: 0.1
    max: 0.99

  model.eta:
    distribution: uniform
    min: 0.01
    max: 0.99

  model.gamma:
    distribution: uniform
    min: 0
    max: 10

  model.lambda:
    distribution: uniform
    min: 0.1
    max: 10
