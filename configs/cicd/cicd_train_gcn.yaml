# @package _global_

defaults:
  - _self_
  - experiment: null
  - hparams_search: null
  - optional local: default
  - debug: null


## ----------------
## General settings
## ----------------
task_name: "cicd"
experiment_name: "cicd_train_gcn_target"

tags: ["cicd", "gcn"]

train: True
test: True
ckpt_path: null
seed: null

## ----------------------------------
## Configuration for gcn CI/CD
## ----------------------------------
data:
  _target_: src.data.GraphWWMDataModule.GraphWWMDataModule
  data_dir: /builds/hereon-ksn/wave-wind-model-emulator/DATA/cicd.zarr
  train_days: [1, 3]
  val_days: [3, 4]
  test_days: [4, 5]
  features:
    - windSpeedX
    - windSpeedY
    - prev_sigWaveHeight
  graph_features:
    - SCHISM_hgrid_edge_nodes
  targets:
    - sigWaveHeight
  scaling_config: src/data/scaling/scale_2020-01-31_2020-02-02.yaml
  node_idx_csv: null
  batch_size: 2
  num_workers: 0
  pin_memory: false
  preload_data: true
  sample_weight_strategy: null
  sample_weight_power: 1.0

model:
  _target_: src.model.GraphWWMEmulator.GraphWWMEmulator
  target_names: ${data.targets}
  loss_weights: null
  target_bins: null

  backbone:
    _target_: src.model.backbones.GCNCenterNet.GCNCenterNet
    input_dim: 3   # must match len(data.features)
    output_dim: 1  # must match len(data.targets)
    hidden_dim: 128
    num_layers: 3
    dropout: 0.1

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5
    patience: 3

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  min_epochs: 1
  max_epochs: 1
  limit_train_batches: 2
  limit_val_batches: 2
  limit_test_batches: 2
  accelerator: auto
  devices: auto
  enable_progress_bar: false


logger: null

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/loss
    save_last: true
    save_top_k: 1
    mode: "min"
    auto_insert_metric_name: True

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/loss
    patience: 5
    mode: "min"

  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1

paths:
  root_dir: ${hydra:runtime.cwd}
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}

hydra:
  defaults:
    - override hydra_logging: colorlog
    - override job_logging: colorlog

  run:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  job_logging:
    handlers:
      file:
        filename: ${hydra.runtime.output_dir}/${task_name}_${experiment_name}.log
