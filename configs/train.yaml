# @package _global_

defaults:
  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - _self_ # put this on top so main config loads first
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=fast_dev_run`)
  - debug: null


## ----------------
## General settings
## ----------------
task_name: "train" # determines output directory
experiment_name: "default"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training (as per checkpoint callback metric)
test: True

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: null

## ----------------------------------
## Default configuration for training
## ----------------------------------
data:
  _target_: src.data.WWMDataModule.WWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/combined
  train_days: [31, 33]  # Day range for training [start_day, end_day] inclusive
  val_days: [34, 34]  # Day range for validation [start_day, end_day] inclusive
  test_days: [35, 36]  # Day range for testing [start_day, end_day] inclusive
  features:
    - windSpeedX
    - windSpeedY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight
  scaling_config: src/data/scaling/scale_2020-01-31_2020-02-02.yaml
  batch_size: 2048
  num_workers: 8
  pin_memory: true
  # Set persistent_workers to avoid recreating workers each epoch
  # Only works with num_workers > 0
  persistent_workers: true

  # Optional: sample weighting strategy for imbalanced regression
  # Strategy for computing per-sample weights based on target values
  # Options: null (no weighting), 'abs_value' (weight by absolute value of targets)
  # 'abs_value' uses formula: weight = (1 + |target|)^power, so larger values get higher weight
  # Weights are computed once before training and normalized so sum = n_samples (mean = 1.0)
  sample_weight_strategy: null # Set to 'abs_value' to enable sample weighting

  # Power for sample weighting (only used when sample_weight_strategy is not null)
  # Higher values increase focus on large target values (default: 1.0)
  # With power=1.0: weight = (1 + |target|), linear increase
  # With power=2.0: weight = (1 + |target|)^2, quadratic increase (more aggressive)
  # Example: |target|=0.1 -> weight=1.1 (power=1) or 1.21 (power=2)
  #          |target|=0.5 -> weight=1.5 (power=1) or 2.25 (power=2)
  sample_weight_power: 1.0

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets} # automatically use target names from data config

  # Optional: specify loss weights for each target (defaults to 1.0 for all)
  # Use this when targets are on different scales to balance their contribution to total loss
  # Example: loss_weights: {sigWaveHeight: 1.0, waveDirection: 0.01}
  loss_weights: null

  # Optional: specify bin edges for tracking binned RMSE metrics on validation set
  # Useful for analyzing model performance across different value ranges
  # Example: target_bins: {delta_sigWaveHeight: [-1.0, 0.0, 0.5]}
  # Creates bins: <-1, [-1,0), [0,0.5), >=0.5 and tracks RMSE for each
  target_bins: null

  backbone:
    _target_: src.model.backbones.DenseNet.DenseNet
    input_dim: 3 # must match len(data.features)
    output_dim: 1 # must match len(data.targets)
    num_hidden_layers: 3 # number of hidden layers
    first_layer_neurons: 128 # neurons in first hidden layer
    layer_scaling: halving # "constant" or "halving"
    dropout_rate: 0.1 # dropout probability (0.0 = no dropout)

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true # required for hydra instantiate
    lr: 0.0001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true # required for hydra instantiate
    mode: min
    factor: 0.5
    patience: 3

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  min_epochs: 1
  max_epochs: 1000
  accelerator: auto
  devices: auto
  enable_progress_bar: false

  # Performance optimizations
  # Gradient accumulation can help with memory if you want larger effective batch size
  # accumulate_grad_batches: 1

  # Mixed precision training for faster computation (if using GPU)
  # precision: "16-mixed"  # Uncomment if using modern GPU (Volta+)

  # Benchmark mode finds fastest algorithms for your hardware
  benchmark: true


logger:
  wandb: # wandb.ai
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    # name: "" # name of the run (normally generated by wandb)
    save_dir: "${paths.output_dir}"
    offline: False
    id: null # pass correct id to resume experiment!
    project: simple-wwm-emulator
    entity: wwm-emulator
    log_model: False # upload lightning ckpts

callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/loss
    save_last: true
    save_top_k: 1
    mode: "min"
    auto_insert_metric_name: True # when True, the checkpoints filenames will contain the metric name

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/loss
    patience: 5
    mode: "min"

  model_summary:
    _target_: lightning.pytorch.callbacks.RichModelSummary
    max_depth: -1

paths:
  root_dir: ${hydra:runtime.cwd}

  # path to output directory, created dynamically by hydra
  # path generation pattern is specified in `configs/hydra/default.yaml`
  # use it to store all files generated during the run, like ckpts and metrics
  output_dir: ${hydra:runtime.output_dir}

  # path to working directory
  work_dir: ${hydra:runtime.cwd}

hydra: # https://hydra.cc/docs/configure_hydra/intro/
  # enable color logging
  defaults:
    - override hydra_logging: colorlog
    - override job_logging: colorlog

  # output directory, generated dynamically on each run
  run:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.root_dir}/logs/${task_name}/${experiment_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  job_logging:
    handlers:
      file:
        # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
        filename: ${hydra.runtime.output_dir}/${task_name}_${experiment_name}.log
