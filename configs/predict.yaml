# @package _global_

defaults:
  - _self_ # put this here so following configs overwrite the defaults in train.yaml

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null


## ----------------
## General settings
## ----------------
task_name: "predict" # determines output directory

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["prediction"]

# stored weights for evaluation
#ckpt_path: ./logs/train/runs/2025-11-20_10-09-49/simple-wwm-emulator/a7lrxh82/checkpoints/epoch=2-step=262614.ckpt
ckpt_path: /work/ka1176/caroline/gitlab/wave-wind-model-emulator/checkpoints/epoch=0-step=50-v1.ckpt

# seed for random number generators in pytorch, numpy and python.random
seed: null

test_metrics: false # run additional test pass

## ------------------------------------
## Default configuration for evaluating
## ------------------------------------
data:
  _target_: src.data.WWMDataModule.WWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [1, 304]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight
  scaling_config: src/data/scaling/scale_2020_hourly.yaml
  node_idx_csv: null
  boundary_nodes_csv: src/data/node_selection/boundary_nodes.csv
  batch_size: 2048
  num_workers: 8
  pin_memory: true
  # Set persistent_workers to avoid recreating workers each epoch
  # Only works with num_workers > 0
  persistent_workers: true

  # Optional: sample weighting strategy for imbalanced regression
  # Options: null (no weighting), 'abs_value' (weight by absolute value of targets), 'z_score'
  sample_weight_strategy: null

  sample_weight_power: 1.0 # Exponent for controlling sample weight intensity

  # Optional: subsample training data based on z_score probability
  # If set (e.g., 0.5), samples with higher z_scores (outliers) are more likely to be retained
  # Only applied to training dataset, not validation or test
  subsample_prob: null # Set to value between 0 and 1 to enable subsampling (e.g., 0.3)

  # Preload training features in memory (targets are always preloaded)
  preload_data: true

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets} # automatically use target names from data config
  loss_weights: null
  target_bins: null
  output_constraints: null

  backbone:
    _target_: src.model.backbones.DenseNet.DenseNet
    input_dim: 3 # must match len(data.features)
    output_dim: 1 # must match len(data.targets)
    num_hidden_layers: 3 # number of hidden layers
    first_layer_neurons: 128 # neurons in first hidden layer
    layer_scaling: halving # "constant" or "halving"

  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true # required for hydra instantiate
    lr: 0.0001

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true # required for hydra instantiate
    mode: min
    factor: 0.5
    patience: 5

logger:
  wandb: # wandb.ai
    _target_: lightning.pytorch.loggers.wandb.WandbLogger
    # name: "" # name of the run (normally generated by wandb)
    save_dir: "${paths.output_dir}"
    offline: False
    id: null # pass correct id to resume experiment!
    project: simple-wwm-emulator
    entity: wwm-emulator
    log_model: False # upload lightning ckpts

trainer:
  _target_: lightning.pytorch.trainer.Trainer
  min_epochs: 1
  max_epochs: 1000
  accelerator: auto
  devices: auto
  enable_progress_bar: false

paths:
  root_dir: ${hydra:runtime.cwd}

  # path to output directory, created dynamically by hydra
  # path generation pattern is specified in `configs/hydra/default.yaml`
  # use it to store all files generated during the run, like ckpts and metrics
  output_dir: ${hydra:runtime.output_dir}

  # path to working directory
  work_dir: ${hydra:runtime.cwd}

hydra: # https://hydra.cc/docs/configure_hydra/intro/
  # enable color logging
  defaults:
    - override hydra_logging: colorlog
    - override job_logging: colorlog

  # output directory, generated dynamically on each run
  run:
    dir: ${paths.root_dir}/logs/${task_name}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${paths.root_dir}/logs/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  job_logging:
    handlers:
      file:
        # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
        filename: ${hydra.runtime.output_dir}/${task_name}.log
