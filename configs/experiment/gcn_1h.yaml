# @package _global_

# GCN with hourly output

predict: false
test: false

experiment_name: "gcn_1h"

data:
  train_days: [1, 304]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_sigWaveHeight
  targets:
    - sigWaveHeight
  sample_weight_strategy: z_score

model:
  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0]
  backbone:
    _target_: src.model.backbones.GCNFullNet.GCNFullNet
    input_dim: 7   # must match len(data.features)
    output_dim: 1  # must match len(data.targets)
    hidden_dim: 128
    num_layers: 3
    dropout: 0.1

trainer:
  devices: 1
  val_check_interval: 20000 # set to 1.0 to cover all


logger: # set to null to disable logging
  wandb:
    project: wwm-emulator-hourly

tags: ["dev", "densenet"]
