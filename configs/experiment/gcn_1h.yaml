# @package _global_

# GCN with hourly output

predict: false
test: false

experiment_name: "gcn_1h"

data:
  train_days: [1, 90]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_sigWaveHeight
  targets:
    - sigWaveHeight
  sample_weight_strategy: z_score
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  scaling_config: src/data/scaling/scale_2020_8months_hourly.yaml

model:
  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0]

  backbone:
    input_dim: 7
    output_dim: 1

  output_constraints:
    sigWaveHeight: semipositive

trainer:
  devices: 1


logger: # set to null to disable logging
  wandb:
    project: wwm-emulator-hourly

tags: ["dev", "gcn"]
