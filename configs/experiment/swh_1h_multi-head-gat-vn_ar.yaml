# @package _global_

predict: false

experiment_name: "swh_1h_multi-head-gat-vn_ar"

data:
  _target_: src.data.GraphARWWMDataModule.GraphARWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [[1, 152], [214, 305]]
  val_days: [[153, 182], [306, 335]]
  test_days: [[183, 213], [336, 366]]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_sigWaveHeight
  targets:
    - sigWaveHeight
  graph_features:
    - SCHISM_hgrid_edge_nodes
  # Number of future steps (T) to roll out during training; the loss is
  # averaged across all T steps. Increase to encourage more stable
  # long-horizon rollouts; decrease if training is unstable or too slow.
  rollout_steps: 6
  sample_weight_strategy: histogram
  sample_weight_variable: delta_sigWaveHeight
  sample_weight_power: 0.2
  scaling_config: src/data/scaling/scale_2020_8months_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  boundary_nodes_csv: src/data/node_selection/boundary_nodes.csv
  batch_size: 256
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  max_nodes: 500
  edge_weight_scale: 2000.0

model:
  _target_: src.model.ARGraphWWMEmulator.ARGraphWWMEmulator

  target_names: ${data.targets}
  rollout_steps: ${data.rollout_steps}
  # Stop gradients through fed-back predictions (cheaper, more stable). Set
  # to false to backpropagate through the full rollout (BPTT) instead.
  rollout_detach: true

  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0, 4.0]

  backbone:
    _target_: src.model.backbones.MultiHeadGATVN.MultiHeadGATVN
    input_dim: 7         # must match len(data.features)
    output_dim: 1        # must match len(data.targets)
    hidden_dim: 64
    num_layers: 9
    heads: 1            # attention heads (hidden_dim must be divisible)
    edge_encoding: scalar # scalar | none (edge-weight ablation)
    dropout: 0.3
    attn_dropout: 0.1

  optimizer:
    lr: 0.0025

  output_constraints:
    sigWaveHeight: semipositive

trainer:
  devices: 4

logger:
  wandb:
    project: wwm-emulator-hourly-final
    tags: ["swh-1h", "gat-vn", "autoregressive"]
