# @package _global_

predict: false

experiment_name: "swh_1h_multi-head-gat-vn"

data:
  _target_: src.data.GraphWWMDataModule.GraphWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [1, 90]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_sigWaveHeight
  targets:
    - sigWaveHeight
  graph_features:
    - SCHISM_hgrid_edge_nodes
  sample_weight_strategy: z_score
  sample_weight_power: 20.0
  scaling_config: src/data/scaling/scale_2020_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  batch_size: 128
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  max_radius: 2000000.0
  max_nodes: 500
  max_links: 1000000
  edge_weight_scale: 20000.0

model:
  _target_: src.model.GraphWWMEmulator.GraphWWMEmulator

  target_names: ${data.targets}

  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0]

  backbone:
    _target_: src.model.backbones.MultiHeadGATVN.MultiHeadGATVN
    input_dim: 7         # must match len(data.features)
    output_dim: 1        # must match len(data.targets)
    hidden_dim: 64
    num_layers: 2
    heads: 16            # attention heads (hidden_dim must be divisible)
    n_rbf: 16            # Gaussian RBF centres for distance encoding
    dropout: 0.1
    attn_dropout: 0.2

  optimizer:
    lr: 0.0007

  output_constraints:
    sigWaveHeight: semipositive

trainer:
  devices: 1

logger:
  wandb:
    project: wwm-emulator-hourly-final

tags: ["swh-1h", "multi-head-gat-vn"]
