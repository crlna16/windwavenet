# @package _global_

# DenseNet with more relevant features

experiment_name: "best_sweep_na1becz6"

data:
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - windStressX
    - windStressY
    - depthAverageVelX
    - depthAverageVelY
  targets:
    - delta_sigWaveHeight
  batch_size: 2972

model:
  backbone:
    input_dim: 7 # must match len(data.features)
    dropout_rate: 0.39232145700333854
    first_layer_neurons: 16
    layer_scaling: "constant"
    num_hidden_layers: 5

  optimizer:
    lr: 0.0001064128149338442

tags: ["dev"]
