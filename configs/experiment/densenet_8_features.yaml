# @package _global_

# DenseNet with more relevant features

experiment_name: "densenet_8_features"

data:
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - windStressX
    - windStressY
    - depthAverageVelX
    - depthAverageVelY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight

model:
  target_bins:
    delta_sigWaveHeight: [-0.1, 0, 0.1]
  backbone:
    input_dim: 8 # must match len(data.features)

tags: ["dev"]
