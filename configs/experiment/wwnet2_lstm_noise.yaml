# @package _global_

# wwnet2_lstm with training-time noise on all prev_<target> inputs.
# Identical to wwnet2_lstm.yaml except for experiment_name, prev_noise_std,
# early-stopping patience and the wandb tags.

predict: false

experiment_name: "wwnet2_lstm_noise"

data:
  _target_: src.data.SequenceWWMDataModule.SequenceWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_SNS_RUN00a_LevanteJP.zarr
  train_days: [[1, 152], [214, 305]]
  val_days: [[153, 182], [306, 335]]
  test_days: [[183, 213], [336, 366]]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - depth
    - prev_sigWaveHeight
    - prev_sin_meanWaveDirection
    - prev_cos_meanWaveDirection
    - prev_meanWavePeriod
    - prev_peakPeriod
    - prev_continuousPeakPeriod
    - prev_sin_dominantDirection
    - prev_cos_dominantDirection
    - prev_rmsOrbitalVelocity
    - prev_bottomExcursionPerio # sic!
    - prev_peakPhaseVel
    - prev_peakWaveLength
    - prev_dissRateDepBreaking
    #- prev_rollerDissRate
  targets:
    - sigWaveHeight
    - sin_meanWaveDirection
    - cos_meanWaveDirection
    - meanWavePeriod
    - peakPeriod
    - continuousPeakPeriod
    - sin_dominantDirection
    - cos_dominantDirection
    - rmsOrbitalVelocity
    - bottomExcursionPerio # sic!
    - peakPhaseVel
    - peakWaveLength
    - dissRateDepBreaking
    #- rollerDissRate

  seq_len: 6
  sample_weight_strategy: histogram
  sample_weight_power: 0.2
  sample_weight_variable: delta_sigWaveHeight
  scaling_config: src/data/scaling/scale_2020_SNS00a.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_SNS00a_10000.csv
  boundary_nodes_csv: null # TODO src/data/node_selection/boundary_nodes.csv
  batch_size: 1024
  # SimpleWWMDataset/SequenceWWMDataset fully preload X/y into RAM at
  # construction time, so DataLoader workers have no I/O to parallelize --
  # only duplication risk. num_workers=0 avoids that risk for free.
  num_workers: 0

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets}

  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0, 4.0]

  backbone:
    _target_: src.model.backbones.LSTMNet.LSTMNet
    input_dim: 19
    output_dim: 13
    hidden_dim: 128
    num_layers: 1
    dropout: 0.0
    bidirectional: false
    mlp_decoder: true # true: Linear -> ReLU -> Linear decoder instead of a single Linear
    decoder_hidden_dim: 64   # only used if mlp_decoder is true

  optimizer:
    lr: 0.002

  # Training-time noise on the prev_<target> input channels, sigma in PHYSICAL
  # units. Applied to the TRAINING batch only, so val/test stay clean and
  # val/loss stays comparable with runs trained without noise. Constant over
  # training (no annealing); i.i.d. per sample, node and sequence step.
  #
  # Sigma = 1 x the RMSE at lead 24 h of a wwnet2_lstm rollout (no noise),
  # averaged over several start times. By 24 h most variables have reached
  # ~80-90% of their error plateau; later leads mostly add weather-dependent
  # fluctuation, earlier ones understate the error the model keeps receiving
  # on its prev_* inputs in a long coupled run. Conservative variant: 0.5 x.
  #
  # Directions are the exception: noise is added to sin and cos independently,
  # which moves the pair off the unit circle, whereas fed-back predictions are
  # always on it. Sigma is therefore capped at 0.15 (about 9 degrees) instead
  # of the ~0.42-0.53 rollout RMSE.
  #
  # Noise is not clamped: prev_ values can leave their physical range
  # (e.g. slightly negative wave height near calm nodes).
  prev_noise_std:
    sigWaveHeight: 0.196         # m        (24 h RMSE 0.196)
    sin_meanWaveDirection: 0.15  # -        (24 h RMSE 0.420, capped)
    cos_meanWaveDirection: 0.15  # -        (24 h RMSE 0.485, capped)
    meanWavePeriod: 0.85         # s        (24 h RMSE 0.850)
    peakPeriod: 1.14             # s        (24 h RMSE 1.141)
    continuousPeakPeriod: 1.33   # s        (24 h RMSE 1.329)
    sin_dominantDirection: 0.15  # -        (24 h RMSE 0.442, capped)
    cos_dominantDirection: 0.15  # -        (24 h RMSE 0.530, capped)
    rmsOrbitalVelocity: 0.041    # m/s      (24 h RMSE 0.041)
    bottomExcursionPerio: 0.036  # m        (24 h RMSE 0.036)
    peakPhaseVel: 1.54           # m/s      (24 h RMSE 1.537)
    peakWaveLength: 11.0         # m        (24 h RMSE 10.96)
    dissRateDepBreaking: 0.113   # W/m^2    (24 h RMSE 0.113)

  # Softplus-based constraints (positive/negative) instead of the ReLU-based
  # semipositive/seminegative: a ReLU output that is clamped for every sample
  # has zero gradient and stays stuck at 0 (seen for dissRateDepBreaking).
  output_constraints:
    sigWaveHeight: positive
    sin_meanWaveDirection: unit_circle
    cos_meanWaveDirection: unit_circle
    meanWavePeriod: positive
    peakPeriod: positive
    continuousPeakPeriod: positive
    sin_dominantDirection: unit_circle
    cos_dominantDirection: unit_circle
    rmsOrbitalVelocity: positive
    bottomExcursionPerio: positive # sic!
    peakPhaseVel: positive
    peakWaveLength: positive
    dissRateDepBreaking: negative
    # rollerDissRate: null

  # Targets are not scaled (unlike features), and their raw variances differ a
  # lot (period-scale targets have much larger squared errors than SWH or the
  # bounded sin/cos direction channels). Weighted ~1/Var(target) from
  # src/data/scaling/scale_2020_SNS00a.yaml, normalized to mean 1 so
  # the overall loss magnitude (relevant for gradient_clip_val) is unchanged.
  # sin/cos variance isn't measured (not z-scored) - approximated as 0.5 from
  # sin^2+cos^2=1 under roughly symmetric directions.
  loss_weights:
    sigWaveHeight: 0.17
    sin_meanWaveDirection: 0.33
    cos_meanWaveDirection: 0.33
    meanWavePeriod: 0.05
    peakPeriod: 0.03
    continuousPeakPeriod: 0.02
    sin_dominantDirection: 0.33
    cos_dominantDirection: 0.33
    rmsOrbitalVelocity: 6.78
    bottomExcursionPerio: 4.15
    peakPhaseVel: 0.01
    peakWaveLength: 0.001
    dissRateDepBreaking: 0.50
    rollerDissRate: 0.0

trainer:
  devices: 1

callbacks:
  early_stopping:
    # Noise makes val/loss (clean inputs) worse by design, so early stopping on
    # it works against the run. Select the checkpoint on rollout skill instead.
    patience: 30

logger:
  wandb:
    project: windwavenet2
    tags: ["wwnet2", "lstm", "noise", "dev"]
