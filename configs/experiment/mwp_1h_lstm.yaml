# @package _global_

predict: false

experiment_name: "mwp_1h_lstm"

data:
  _target_: src.data.SequenceWWMDataModule.SequenceWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [1, 90]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_meanWavePeriod
  targets:
    - meanWavePeriod
  seq_len: 24
  sample_weight_strategy: z_score
  sample_weight_power: 20.0
  scaling_config: src/data/scaling/scale_2020_JFM_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  batch_size: 1024
  # SimpleWWMDataset/SequenceWWMDataset fully preload X/y into RAM at
  # construction time, so DataLoader workers have no I/O to parallelize --
  # only duplication risk. num_workers=0 avoids that risk for free.
  num_workers: 0

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets}

  target_bins:
    meanWavePeriod: [3.0, 7.0]

  backbone:
    _target_: src.model.backbones.LSTMNet.LSTMNet
    input_dim: 7
    output_dim: 1
    hidden_dim: 128
    num_layers: 1
    dropout: 0.7
    bidirectional: false

  optimizer:
    lr: 0.0007

  output_constraints:
    meanWavePeriod: semipositive

trainer:
  devices: 1

logger:
  wandb:
    project: wwm-emulator-hourly-final
    tags: ["mwp-1h", "lstm"]
