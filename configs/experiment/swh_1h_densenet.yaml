# @package _global_

predict: false

experiment_name: "shw_1h_densenet"

data:
  _target_: src.data.WWMDataModule.WWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [1, 90]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - peakPeriod
    - prev_sigWaveHeight
  targets:
    - sigWaveHeight
  sample_weight_strategy: z_score
  sample_weight_power: 20.0
  scaling_config: src/data/scaling/scale_2020_JFM_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  batch_size: 1024

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets}

  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0]

  backbone:
    _target_: src.model.backbones.DenseNet.DenseNet
    input_dim: 7 # must match len(data.features)
    output_dim: 1 # must match len(data.targets)
    num_hidden_layers: 2 # number of hidden layers
    first_layer_neurons: 64 # neurons in first hidden layer
    layer_scaling: constant # "constant" or "halving"
    dropout_rate: 0.1 # dropout probability (0.0 = no dropout)

  optimizer:
    lr: 0.0007

  output_constraints:
    sigWaveHeight: semipositive

trainer:
  devices: 1

logger:
  wandb:
    project: wwm-emulator-hourly-final

tags: ["swh-1h", "lstm"]
