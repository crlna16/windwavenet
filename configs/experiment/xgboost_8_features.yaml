# @package _global_

# XGBoost with more relevant features

experiment_name: "xgboost_8_features"

data:
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - windStressX
    - windStressY
    - depthAverageVelX
    - depthAverageVelY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight
  sample_weight_strategy: abs_value

model:
  target_bins:
    delta_sigWaveHeight: [-0.1, 0.1]

tags: ["dev", "xgboost"]
