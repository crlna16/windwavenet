# @package _global_

# GCN with JumpingKnowledge skip connections
#
# Combines every layer's node representations before projecting to output.
# This preserves both local (shallow) and long-range (deep) structure and
# counters oversmoothing in deeper stacks.
#
# jk_mode options:
#   cat  — concatenate all layers (fc input = num_layers * hidden_dim)
#   max  — element-wise max       (fc input = hidden_dim)
#   lstm — LSTM attention          (fc input = hidden_dim)
#
# Usage:
#   uv run src/train.py --config-name=train_gcn experiment=gcn_jk

experiment_name: "gcn_jk"

model:
  backbone:
    _target_: src.model.backbones.GCNJKNet.GCNJKNet
    input_dim: 3   # must match len(data.features)
    output_dim: 1  # must match len(data.targets)
    hidden_dim: 64
    num_layers: 5
    dropout: 0.1
    jk_mode: cat
