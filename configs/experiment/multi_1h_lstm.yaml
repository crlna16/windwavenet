# @package _global_

predict: false

experiment_name: "multi_1h_lstm"

data:
  _target_: src.data.SequenceWWMDataModule.SequenceWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [[1, 152], [214, 305]]
  val_days: [[153, 182], [306, 335]]
  test_days: [[183, 213], [336, 366]]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - depth
    - prev_sigWaveHeight
    - prev_meanWavePeriod
    - prev_sin_meanWaveDirection
    - prev_cos_meanWaveDirection
    - prev_peakPeriod
  targets:
    - sigWaveHeight
    - meanWavePeriod
    - sin_meanWaveDirection
    - cos_meanWaveDirection
    - peakPeriod
  seq_len: 24
  sample_weight_strategy: histogram
  sample_weight_power: 0.2
  sample_weight_variable: delta_sigWaveHeight
  scaling_config: src/data/scaling/scale_2020_8months_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  boundary_nodes_csv: src/data/node_selection/boundary_nodes.csv
  batch_size: 1024
  # SimpleWWMDataset/SequenceWWMDataset fully preload X/y into RAM at
  # construction time, so DataLoader workers have no I/O to parallelize --
  # only duplication risk. num_workers=0 avoids that risk for free.
  num_workers: 0

model:
  _target_: src.model.WWMEmulator.WWMEmulator

  target_names: ${data.targets}

  target_bins:
    sigWaveHeight: [0.5, 1.0, 2.0, 4.0]

  # Targets are not scaled (unlike features), and their raw variances differ a
  # lot (period-scale targets have much larger squared errors than SWH or the
  # bounded sin/cos direction channels). Weighted ~1/Var(target) from
  # src/data/scaling/scale_2020_8months_hourly.yaml, normalized to mean 1 so
  # the overall loss magnitude (relevant for gradient_clip_val) is unchanged.
  # sin/cos variance isn't measured (not z-scored) - approximated as 0.5 from
  # sin^2+cos^2=1 under roughly symmetric directions.
  loss_weights:
    sigWaveHeight: 0.9512
    meanWavePeriod: 0.4363
    peakPeriod: 0.2435
    sin_meanWaveDirection: 1.6845
    cos_meanWaveDirection: 1.6845

  backbone:
    _target_: src.model.backbones.LSTMNet.LSTMNet
    input_dim: 11
    output_dim: 5
    hidden_dim: 128
    num_layers: 1
    dropout: 0.0
    bidirectional: false

  optimizer:
    lr: 0.002

  output_constraints:
    sigWaveHeight: semipositive
    peakPeriod: semipositive
    sin_meanWaveDirection: unit_circle
    cos_meanWaveDirection: unit_circle

trainer:
  devices: 1

logger:
  wandb:
    project: wwm-emulator-hourly-final
    tags: ["multi-1h", "lstm"]
