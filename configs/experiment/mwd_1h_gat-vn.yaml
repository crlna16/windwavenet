# @package _global_

predict: false

experiment_name: "mwd_1h_gat-vn"

data:
  _target_: src.data.GraphWWMDataModule.GraphWWMDataModule
  data_dir: /work/ka1176/shared_data/2025-wwm-emulator-schism/processed_RUN04b_JUWELS_wpile.zarr
  train_days: [[1, 152], [214, 305]]
  val_days: [[153, 182], [306, 335]]
  test_days: [[183, 213], [336, 366]]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - depth
    - prev_sin_meanWaveDirection
    - prev_cos_meanWaveDirection
  targets:
    - sin_meanWaveDirection
    - cos_meanWaveDirection
  graph_features:
    - SCHISM_hgrid_edge_nodes
  sample_weight_strategy: null # histogram
  scaling_config: src/data/scaling/scale_2020_8months_hourly.yaml
  node_idx_csv: src/data/node_selection/node_idx_closest_center_10000.csv
  boundary_nodes_csv: src/data/node_selection/boundary_nodes.csv
  batch_size: 256
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  max_nodes: 500
  edge_weight_scale: 2000.0

model:
  _target_: src.model.GraphWWMEmulator.GraphWWMEmulator

  target_names: ${data.targets}

  target_bins: null

  backbone:
    _target_: src.model.backbones.MultiHeadGATVN.MultiHeadGATVN
    input_dim: 8         # must match len(data.features)
    output_dim: 2        # must match len(data.targets)
    hidden_dim: 64
    num_layers: 9
    heads: 1            # attention heads (hidden_dim must be divisible)
    edge_encoding: scalar # scalar | none (edge-weight ablation)
    dropout: 0.3
    attn_dropout: 0.1

  optimizer:
    lr: 0.0025

  # Training-time noise on the prev_<target> input channels, sigma in PHYSICAL
  # units. Applied to the TRAINING batch only, so val/test stay clean and
  # val/loss stays comparable with runs trained without noise.
  # Set sigma from the measured one-step validation RMSE of this model.
  #prev_noise_std:
  #   sin_meanWaveDirection: 0.002

  output_constraints:
    sin_meanWaveDirection: unit_circle
    cos_meanWaveDirection: unit_circle

trainer:
  devices: 4

logger:
  wandb:
    project: wwm-emulator-hourly-final
    tags: ["mwd-1h", "gat-vn"]
