# @package _global_

# Encoder-Processor-Decoder GCN (MeshGraphNets-style)
#
# Encoder  — node-local MLP lifts raw features into latent space
# Processor — GCNConv message-passing in latent space with residual connections
# Decoder  — node-local MLP maps latent embeddings to physical output
#
# Usage:
#   uv run src/train.py --config-name=train_gcn experiment=gcn_epd

experiment_name: "gcn_epd"

model:
  backbone:
    input_dim: 3
    output_dim: 1
    hidden_dim: 64
    encoder_layers: 2
    num_mp_layers: 5
    decoder_layers: 2
    dropout: 0.1
    use_residual: true
