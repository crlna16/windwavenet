# @package _global_

# DenseNet with hourly output

predict: false

experiment_name: "densenet_1h"

data:
  train_days: [1, 304]
  val_days: [305, 334]
  test_days: [335, 365]
  features:
    - windSpeedX
    - windSpeedY
    - elevation
    - depthAverageVelX
    - depthAverageVelY
    - prev_sigWaveHeight
  targets:
    - delta_sigWaveHeight
  sample_weight_strategy: z_score

model:
  target_bins:
    delta_sigWaveHeight: [-0.1, 0.1]
  backbone:
    input_dim: 6
    num_hidden_layers: 3
    first_layer_neurons: 512
    layer_scaling: halving
    dropout_rate: 0.3

trainer:
  devices: 1
  val_check_interval: 20000 # set to 1.0 to cover all


logger: # set to null to disable logging
  wandb:
    project: wwm-emulator-hourly

tags: ["dev", "densenet"]
